name: Branches 360 Data Update

on:
  repository_dispatch:
    types: [branches360_update]

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write Power Automate payload
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD" > branches360-data.json
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add branches360-data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update Branches 360 dashboard data"
            git push
          fi
