<script>

const reports = {

  quality: {
    title: "Quality Visits Dashboard",
    embedUrl: "https://app.powerbi.com/reportEmbed?reportId=a6d65b4c-579d-4bbd-b28c-c5c1df1c3d99&autoAuth=true&ctid=7a09d8f3-71ea-494a-b504-36d7ece273f3&filterPaneEnabled=false&navContentPaneEnabled=false"
  },

  it: {
    title: "IT KPIs Dashboard",
    embedUrl: "https://app.powerbi.com/reportEmbed?reportId=6d7d73ee-36e2-447a-850f-7a940ec52bb2&autoAuth=true&ctid=7a09d8f3-71ea-494a-b504-36d7ece273f3&filterPaneEnabled=false&navContentPaneEnabled=false"
  },

  ops: {
    title: "Operations KPIs Dashboard",
    embedUrl: "https://app.powerbi.com/reportEmbed?reportId=4d6d3f56-578d-4ae9-8794-50e3c88b739f&autoAuth=true&ctid=7a09d8f3-71ea-494a-b504-36d7ece273f3&filterPaneEnabled=false&navContentPaneEnabled=false"
  },

  admin: {
    title: "Admin KPIs Dashboard",
    embedUrl: "https://app.powerbi.com/reportEmbed?reportId=c3a3c7b7-7600-47fe-b675-9aad74e24e9d&autoAuth=true&ctid=7a09d8f3-71ea-494a-b504-36d7ece273f3&filterPaneEnabled=false&navContentPaneEnabled=false"
  },

  incidents: {
    title: "COO Area Incidents Dashboard",
    embedUrl: "https://app.powerbi.com/reportEmbed?reportId=14f20afc-1d09-4fc1-bd6c-0e7b41ed69de&autoAuth=true&ctid=7a09d8f3-71ea-494a-b504-36d7ece273f3&filterPaneEnabled=false&navContentPaneEnabled=false"
  }

};


function openReport(reportKey) {

  const reportInfo = reports[reportKey];

  document.getElementById("homePage").style.display = "none";
  document.getElementById("footer").style.display = "none";
  document.getElementById("viewerPage").style.display = "block";

  document.getElementById("viewerTitle").textContent = reportInfo.title;

  const container = document.getElementById("reportContainer");

  container.innerHTML = `
    <iframe
      src="${reportInfo.embedUrl}"
      style="
        width:100%;
        height:100%;
        border:0;
        display:block;
      "
      allowfullscreen="true">
    </iframe>
  `;

  window.scrollTo(0,0);
}


function goHome() {

  const container = document.getElementById("reportContainer");

  container.innerHTML = "";

  document.getElementById("viewerPage").style.display = "none";
  document.getElementById("homePage").style.display = "block";
  document.getElementById("footer").style.display = "block";

  window.scrollTo(0,0);
}

</script>
