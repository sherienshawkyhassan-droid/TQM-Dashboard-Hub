name: Verify TQM Analytics Hub

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/verify-hub.yml'
      - 'index.html'
      - 'kpi-summary.csv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify incident source and Hub destinations
        shell: python
        run: |
          import csv
          from pathlib import Path
          hub = Path('index.html').read_text(encoding='utf-8')
          report_id = '14f20afc-1d09-4fc1-bd6c-0e7b41ed69de'
          assert 'incident-intelligence.html' not in hub
          assert not Path('incident-intelligence.html').exists()
          assert hub.count('class="dashboard-card') == 5
          assert "openReport('incidents')" in hub
          assert 'COO Area Incidents Dashboard' in hub
          assert report_id in hub
          assert "dashboard.key === \"incidents\" || !row.KPI" in hub
          with Path('kpi-summary.csv').open(encoding='utf-8-sig', newline='') as f:
              assert all('incident' not in row['Dashboard Name'].lower() for row in csv.DictReader(f))
          print('Five dashboards retained; online knowledge page removed; incident CSV values excluded.')
